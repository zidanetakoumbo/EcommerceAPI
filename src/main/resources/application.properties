spring.application.name=EcommerceAPI

# JWT configuration de connexion
# jwt Secret key
jwt.secret=mysecretkeymysecretkeymysecretkey12


# H2 Database
#  http://localhost:8082/h2-console .

# Activer la console H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
 
# nom de la base en memoire
# mem c'est pour signifier que la base est en memoire
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.sql.init.platform=mysql
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# resoud le probleme de lazy loading dans les controllers
spring.jpa.open-in-view=true

# ── Configuration Stripe ──────────────────────────────────────────────────────
# IMPORTANT : Remplacer ces valeurs par vos vraies clés depuis dashboard.stripe.com
#
# Mode TEST (commence par sk_test_ et pk_test_) → aucun vrai argent prélevé
# Mode LIVE (commence par sk_live_ et pk_live_) → argent réel, à utiliser en production
#
# Clé secrète : NE JAMAIS la partager ni la mettre sur GitHub !
# Clé publique : peut être utilisée côté frontend (Angular), elle est sûre à exposer
stripe.secret.key=sk_test_REMPLACER_PAR_VOTRE_CLE_SECRETE
stripe.publishable.key=pk_test_REMPLACER_PAR_VOTRE_CLE_PUBLIQUE

# Clé de signature du webhook Stripe (obtenue dans Dashboard Stripe > Webhooks)
# Permet de vérifier que les notifications reçues viennent bien de Stripe
# Exemple : whsec_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
stripe.webhook.secret=whsec_REMPLACER_PAR_VOTRE_SECRET_WEBHOOK

# ── Configuration PRODUCTION ─────────────────────────────────────────────────
# Ces valeurs sont lues depuis les variables d'environnement Railway
# Ne jamais mettre de vraies valeurs ici (le fichier peut aller sur GitHub)

# MySQL (Railway injecte ces variables automatiquement)
spring.datasource.url=jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT (à définir dans Railway comme variable d'environnement)
jwt.secret=${JWT_SECRET}

# Stripe (à définir dans Railway)
stripe.secret.key=${STRIPE_SECRET_KEY}
stripe.publishable.key=${STRIPE_PUBLISHABLE_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}

# Désactiver la console H2 (inutile en prod)
spring.h2.console.enabled=false

# Port (Railway injecte $PORT automatiquement)
server.port=${PORT:8080}
